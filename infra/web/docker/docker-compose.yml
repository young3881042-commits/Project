services:
  web:
    build:
      context: ../../../apps/web
      dockerfile: ../../infra/web/docker/Dockerfile
    image: ai-assitant-web:local
    env_file:
      - web.env
    ports:
      - "${WEB_HTTP_PORT:-80}:80"
      - "${WEB_HTTPS_PORT:-443}:443"
    extra_hosts:
      - "host.docker.internal:host-gateway"
