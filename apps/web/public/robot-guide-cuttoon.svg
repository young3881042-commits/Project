<svg xmlns="http://www.w3.org/2000/svg" width="860" height="930" viewBox="0 0 860 930" role="img" aria-labelledby="title desc">
  <title id="title">ai-assitant 메모 일정 안내</title>
  <desc id="desc">메모 작성, 일정 켜기, 내 일정 확인, 메모와 일정 관리 흐름을 보여주는 카드형 안내</desc>
  <defs>
    <filter id="softShadow" x="-12%" y="-12%" width="124%" height="132%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#0f172a" flood-opacity="0.12" />
    </filter>
    <linearGradient id="mintPanel" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#eefdf8" />
      <stop offset="1" stop-color="#ffffff" />
    </linearGradient>
    <linearGradient id="bluePanel" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f3f8ff" />
      <stop offset="1" stop-color="#ffffff" />
    </linearGradient>
    <linearGradient id="robotBody" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#ffffff" />
      <stop offset="1" stop-color="#dbeafe" />
    </linearGradient>
    <style>
      .ui { font-family: "Pretendard", "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
      .titleText { fill: #111827; font-weight: 900; letter-spacing: 0; }
      .bodyText { fill: #1f2937; font-weight: 800; letter-spacing: 0; }
      .mutedText { fill: #64748b; font-weight: 800; letter-spacing: 0; }
      .mintText { fill: #0f766e; font-weight: 900; letter-spacing: 0; }
      .blueText { fill: #2563eb; font-weight: 900; letter-spacing: 0; }
      .card { fill: #ffffff; stroke: #cfdbec; stroke-width: 2; }
      .dash { stroke: #b7c7de; stroke-width: 3; stroke-dasharray: 7 9; stroke-linecap: round; }
      .line { stroke: #cbd5e1; stroke-width: 3; stroke-linecap: round; }
      .route { stroke: #3f67ad; stroke-width: 6; stroke-linecap: round; stroke-dasharray: 1 28; opacity: 0.9; }
    </style>
    <symbol id="miniRobot" viewBox="0 0 140 170">
      <path d="M70 17v22" stroke="#7dd3fc" stroke-width="6" stroke-linecap="round" />
      <circle cx="70" cy="13" r="10" fill="#5eead4" stroke="#76b8c8" stroke-width="3" />
      <rect x="16" y="38" width="108" height="82" rx="34" fill="url(#robotBody)" stroke="#b8c6d8" stroke-width="3" />
      <rect x="32" y="55" width="76" height="45" rx="17" fill="#12233f" />
      <circle cx="55" cy="77" r="7" fill="#5eead4" />
      <circle cx="84" cy="77" r="7" fill="#5eead4" />
      <path d="M55 92q15 13 31 0" fill="none" stroke="#5eead4" stroke-width="5" stroke-linecap="round" />
      <rect x="42" y="119" width="56" height="48" rx="18" fill="url(#robotBody)" stroke="#b8c6d8" stroke-width="3" />
      <path d="M22 94C2 107-1 128 11 138" fill="none" stroke="#b8c6d8" stroke-width="12" stroke-linecap="round" />
      <path d="M118 94c23-9 34-28 26-42" fill="none" stroke="#b8c6d8" stroke-width="12" stroke-linecap="round" />
    </symbol>
    <symbol id="noteCard" viewBox="0 0 150 118">
      <rect x="3" y="3" width="144" height="112" rx="14" fill="#ffffff" stroke="#d5dfec" stroke-width="3" />
      <text class="ui bodyText" x="24" y="39" font-size="18">Note 1</text>
      <path class="line" d="M24 62h86M24 82h102" />
      <path d="M118 86l29-29v47h-29z" fill="#a7f3d0" opacity="0.72" />
    </symbol>
  </defs>

  <rect width="860" height="930" fill="#f7fbff" />
  <g filter="url(#softShadow)">
    <rect x="22" y="22" width="816" height="886" rx="34" fill="#ffffff" />
  </g>

  <g class="ui">
    <rect class="card" x="50" y="50" width="358" height="300" rx="24" fill="#ffffff" />
    <circle cx="102" cy="98" r="26" fill="#10b981" />
    <text x="92" y="108" fill="#ffffff" font-size="28" font-weight="900">1</text>
    <text class="titleText" x="146" y="110" font-size="32">1단계: 메모 작성!</text>
    <path class="dash" d="M146 136h214" />
    <text class="bodyText" x="146" y="186" font-size="24">생각이나 할 일을 메모에</text>
    <text class="bodyText" x="146" y="222" font-size="24">자유롭게 적어요.</text>
    <use href="#miniRobot" x="84" y="218" width="126" height="154" />
    <use href="#noteCard" x="226" y="216" width="142" height="112" />

    <rect class="card" x="452" y="50" width="358" height="300" rx="24" fill="#ffffff" />
    <circle cx="504" cy="98" r="26" fill="#10b981" />
    <text x="494" y="108" fill="#ffffff" font-size="28" font-weight="900">2</text>
    <text class="titleText" x="548" y="110" font-size="32">2단계: 일정 켜기!</text>
    <path class="dash" d="M548 136h214" />
    <text class="bodyText" x="548" y="186" font-size="24">일정으로 쓸 메모는</text>
    <text class="bodyText" x="548" y="222" font-size="24">토글을 켜요.</text>
    <use href="#miniRobot" x="484" y="222" width="126" height="154" />
    <rect x="626" y="214" width="148" height="78" rx="16" fill="#ffffff" stroke="#d5dfec" stroke-width="3" />
    <rect x="646" y="232" width="88" height="40" rx="20" fill="#10b981" />
    <circle cx="715" cy="252" r="17" fill="#ffffff" />
    <text class="mintText" x="640" y="322" font-size="22">Schedule ON</text>

    <path class="route" d="M410 188h43M430 348v52M430 400h-35" />

    <rect class="card" x="50" y="382" width="760" height="260" rx="24" fill="url(#bluePanel)" />
    <circle cx="102" cy="430" r="26" fill="#10b981" />
    <text x="92" y="440" fill="#ffffff" font-size="28" font-weight="900">3</text>
    <text class="titleText" x="146" y="442" font-size="32">3단계: 내 일정 확인!</text>
    <path class="dash" d="M146 468h214" />
    <use href="#miniRobot" x="92" y="500" width="128" height="156" />
    <path d="M258 496h246c22 0 40 18 40 40v56c0 22-18 40-40 40H354l-40 36-12-36h-44c-22 0-40-18-40-40v-56c0-22 18-40 40-40z" fill="#ffffff" stroke="#d9e4f2" stroke-width="3" />
    <text class="bodyText" x="282" y="552" font-size="24">저장하면 내 일정에서</text>
    <text class="bodyText" x="315" y="588" font-size="24">바로 보여요.</text>
    <rect x="548" y="452" width="220" height="146" rx="16" fill="#ffffff" stroke="#d5dfec" stroke-width="3" />
    <text class="mutedText" x="582" y="490" font-size="18">내 일정</text>
    <rect x="570" y="512" width="176" height="36" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" />
    <circle cx="592" cy="530" r="6" fill="#10b981" />
    <text class="bodyText" x="612" y="537" font-size="16">여행 준비하기</text>
    <text class="mutedText" x="702" y="537" font-size="15">09:00</text>
    <rect x="570" y="550" width="176" height="36" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" />
    <circle cx="592" cy="568" r="6" fill="#2563eb" />
    <text class="bodyText" x="612" y="575" font-size="16">맛집 리스트</text>
    <text class="mutedText" x="704" y="575" font-size="15">12:30</text>
    <circle cx="644" cy="617" r="5" fill="#cbd5e1" />
    <circle cx="666" cy="617" r="5" fill="#cbd5e1" />
    <circle cx="688" cy="617" r="5" fill="#cbd5e1" />

    <path class="route" d="M430 642v44M430 686h-58" />

    <rect x="50" y="674" width="760" height="150" rx="24" fill="url(#mintPanel)" stroke="#a7f3d0" stroke-width="3" />
    <use href="#miniRobot" x="116" y="688" width="132" height="160" />
    <path d="M292 704h300c24 0 44 20 44 44v34c0 24-20 44-44 44H458l-38 34-12-34H292c-24 0-44-20-44-44v-34c0-24 20-44 44-44z" fill="#ffffff" stroke="#d9e4f2" stroke-width="3" />
    <text class="titleText" x="336" y="762" font-size="30">이제 <tspan fill="#10b981">메모와 일정</tspan>을</text>
    <text class="titleText" x="336" y="804" font-size="30">한눈에 관리해요!</text>
    <rect x="694" y="730" width="54" height="60" rx="10" fill="#ffffff" stroke="#f6d36b" stroke-width="3" />
    <path class="line" d="M707 752h28M707 770h22" />
    <rect x="724" y="758" width="54" height="54" rx="10" fill="#dbeafe" stroke="#93c5fd" stroke-width="3" />
    <path d="M738 786l11 10 18-24" fill="none" stroke="#2563eb" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
