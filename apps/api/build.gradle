buildscript {
    repositories {
        mavenCentral()
        def privateRepoUrl = System.getenv('MAVEN_REPO_URL')
        if (privateRepoUrl != null && !privateRepoUrl.isBlank()) {
            maven {
                url = uri(privateRepoUrl)
                allowInsecureProtocol = privateRepoUrl.startsWith('http://')
            }
        }
    }
    dependencies {
        classpath 'org.springframework.boot:spring-boot-gradle-plugin:3.3.2'
        classpath 'io.spring.gradle:dependency-management-plugin:1.1.6'
    }
}

apply plugin: 'java'
apply plugin: 'org.springframework.boot'
apply plugin: 'io.spring.dependency-management'

group = 'com.platform.jupiter'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
    def privateRepoUrl = System.getenv('MAVEN_REPO_URL')
    if (privateRepoUrl != null && !privateRepoUrl.isBlank()) {
        maven {
            url = uri(privateRepoUrl)
            allowInsecureProtocol = privateRepoUrl.startsWith('http://')
        }
    }
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-websocket'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.security:spring-security-crypto'
    implementation 'io.fabric8:kubernetes-client:6.13.4'
    runtimeOnly 'org.mariadb.jdbc:mariadb-java-client'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

tasks.named('test') {
    useJUnitPlatform()
}
