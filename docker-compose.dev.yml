services:
  db:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: root123
      MARIADB_DATABASE: jupiter_web
      MARIADB_USER: jupiter
      MARIADB_PASSWORD: jupiter
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./infra/db/docker/initdb:/docker-entrypoint-initdb.d:ro

  api:
    build:
      context: .
      dockerfile: infra/api/docker/Dockerfile
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: jupiter_web
      DB_USER: jupiter
      DB_PASSWORD: jupiter
      APP_FRONTEND_URL: http://localhost:5173
      APP_API_URL: http://localhost:8080/api
      APP_GATEWAY_URL: http://localhost:8080
      APP_CODEX_API_BASE_URL: ${APP_CODEX_API_BASE_URL:-https://api.openai.com/v1}
      APP_CODEX_MODEL: ${APP_CODEX_MODEL:-gpt-5.5}
      APP_OPENAI_API_KEY: ${APP_OPENAI_API_KEY:-}
      APP_OPENAI_MODEL: ${APP_OPENAI_MODEL:-gpt-5.5}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.5}
      ENABLE_CODEX_CLI_MODE: ${ENABLE_CODEX_CLI_MODE:-true}
      APP_PYTHON_TIMEOUT_SECONDS: ${APP_PYTHON_TIMEOUT_SECONDS:-180}
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--XX:MaxRAMPercentage=75.0}
    ports:
      - "8080:8080"
    volumes:
      - /data/codex:/root/.codex
    cpus: "2.0"
    mem_limit: 6g
    mem_reservation: 2g
    depends_on:
      - db

  web:
    build:
      context: apps/web
      dockerfile: ../../infra/web/docker/Dockerfile
    env_file:
      - infra/web/docker/web.env
    ports:
      - "80:5173"
      - "443:5443"
    depends_on:
      - api
      
volumes:
  mariadb_data:
