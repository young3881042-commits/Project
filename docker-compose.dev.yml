services:
  db:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env before starting Docker Compose}
      MARIADB_DATABASE: jupiter_web
      MARIADB_USER: jupiter
      MARIADB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env before starting Docker Compose}
    ports:
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:${DB_PORT:-3306}:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./infra/db/docker/initdb:/docker-entrypoint-initdb.d:ro

  api:
    image: ai-assistant-api:local
    build:
      context: .
      dockerfile: infra/api/docker/Dockerfile
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: jupiter_web
      DB_USER: jupiter
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env before starting Docker Compose}
      APP_FRONTEND_URL: http://localhost:${WEB_HTTP_PORT:-80}
      APP_API_URL: http://localhost:8080/api
      APP_GATEWAY_URL: http://localhost:8080
      APP_JUPYTER_URL: ${APP_JUPYTER_URL:-http://localhost:${NOTEBOOK_PORT:-30888}}
      APP_CODEX_API_BASE_URL: ${APP_CODEX_API_BASE_URL:-https://api.openai.com/v1}
      APP_CODEX_MODEL: ${APP_CODEX_MODEL:-gpt-5.2-codex}
      APP_CODEX_CLI_PATH: ${APP_CODEX_CLI_PATH:-/opt/jupiter-cli/bin/codex}
      APP_CODEX_CLI_BIN_DIR: ${APP_CODEX_CLI_BIN_DIR:-/opt/jupiter-cli/bin}
      APP_OPENAI_API_KEY: ${APP_OPENAI_API_KEY:-}
      APP_OPENAI_MODEL: ${APP_OPENAI_MODEL:-gpt-4.1-mini}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      ENABLE_CODEX_CLI_MODE: ${ENABLE_CODEX_CLI_MODE:-false}
      ENABLE_TRAVEL_PLAN_CODEX_CLI_MODE: ${ENABLE_TRAVEL_PLAN_CODEX_CLI_MODE:-false}
      APP_ASSISTANT_DATA_ROOT: ${APP_ASSISTANT_DATA_ROOT:-/data/ai-assistant}
      APP_CONVERSATION_ROOT: ${APP_CONVERSATION_ROOT:-/data/ai-assistant/conversations}
      APP_WORKSPACE_ROOT: ${APP_WORKSPACE_ROOT:-/data/ai-assistant/workspace}
      APP_PYTHON_TIMEOUT_SECONDS: ${APP_PYTHON_TIMEOUT_SECONDS:-180}
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--XX:MaxRAMPercentage=75.0}
    ports:
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:${API_PORT:-8080}:8080"
    volumes:
      - assistant_data:/data/ai-assistant
    cpus: "2.0"
    mem_limit: 6g
    mem_reservation: 2g
    depends_on:
      - db

  notebook:
    image: quay.io/jupyter/base-notebook:2025-12-31
    restart: unless-stopped
    command:
      - start-notebook.py
      - --IdentityProvider.token=
      - --ServerApp.ip=0.0.0.0
      - --ServerApp.root_dir=/home/jovyan/work
    ports:
      - "127.0.0.1:${NOTEBOOK_PORT:-30888}:8888"
    volumes:
      - notebook_data:/home/jovyan/work
    networks:
      - notebook_runtime

  web:
    image: ai-assistant-web:local
    build:
      context: apps/web
      dockerfile: ../../infra/web/docker/Dockerfile
      args:
        VITE_LIFEHUB_BRIDGE_ADDRESS: ${VITE_LIFEHUB_BRIDGE_ADDRESS:-}
        VITE_LIFEHUB_BRIDGE_PORT: ${VITE_LIFEHUB_BRIDGE_PORT:-}
    env_file:
      - infra/web/docker/web.env
    environment:
      VITE_API_PROXY: http://api:8080
    ports:
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:${WEB_HTTP_PORT:-80}:80"
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:${WEB_HTTPS_PORT:-443}:443"
    depends_on:
      - api
      
volumes:
  mariadb_data:
  notebook_data:
  assistant_data:

networks:
  notebook_runtime:
